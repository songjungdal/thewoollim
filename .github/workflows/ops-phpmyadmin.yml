# [1회용] phpMyAdmin 외부 접근 점검·차단 + IP 로 열리는 기본 사이트 점검·차단 (2026-10-22)
#
# 실행: Actions → "Ops - phpMyAdmin check/block (one-time)" → Run workflow (main 에서만)
#   step=check  읽기만 — 서버 밖(이 실행기)에서 상태 코드 확인 + 서버 설정 요약
#   step=audit  읽기만 — 접근 로그의 /phpmyadmin 과거 기록(개수·날짜만), 기본 사이트(/var/www/html) 파일 점검(이름·개수만), 사이트별 웹 루트
#   step=block  (confirm=BLOCK) Apache 설정 2개 추가 — /phpmyadmin 전부 403, 기본 사이트(/var/www/html) 전부 403 → 바깥에서 다시 확인
# 서버 접속은 deploy.yml 과 같은 방식·같은 production 환경 Secret. 공인 IP 는 받자마자 로그에서 가린다.
# 공개 저장소라 실행 로그는 누구나 볼 수 있다: IP·개인정보 값·관리자 폴더 실제 이름은 출력하지 않는다.
# 작업이 끝나면 이 파일은 삭제한다(1회용).

name: Ops - phpMyAdmin check/block (one-time)

on:
  workflow_dispatch:
    inputs:
      step:
        description: "단계"
        type: choice
        options: [check, audit, block]
        default: check
      confirm:
        description: "block 은 BLOCK 입력 (check·audit 는 비워 둠)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: thewoollim-production
  cancel-in-progress: false

env:
  SITE_HOST: thewoollim.com
  DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'admin' }}
  DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
  DEPLOY_ACCESS_MODE: ${{ vars.DEPLOY_ACCESS_MODE || 'direct' }}
  # 바깥에서 확인하는 표 (변경 전·후에 같은 내용으로 실행)
  PROBE: |
    IP="$(cat "$RUNNER_TEMP/server_ip")"
    code() { curl -s -o /dev/null -m 15 -k -w '%{http_code}' "$1"; }
    loc()  { curl -s -o /dev/null -m 15 -k -w '%{redirect_url}' "$1" | sed "s#$IP#<서버IP>#g"; }
    printf '| %-34s | %-4s | %s\n' "주소" "상태" "이동"
    for h in "$IP" "$SITE_HOST" "www.$SITE_HOST"; do
      for s in http https; do
        for p in / /phpmyadmin/; do
          u="$s://$h$p"; label="${u/$IP/<서버IP>}"
          printf '| %-34s | %-4s | %s\n' "$label" "$(code "$u")" "$(loc "$u")"
        done
      done
    done
    printf '| %-34s | %-4s |\n' "https://$SITE_HOST/api/parties.php" "$(code "https://$SITE_HOST/api/parties.php")"
    printf '| %-34s | %-4s |\n' "https://$SITE_HOST/membership/" "$(code "https://$SITE_HOST/membership/")"
    if getent hosts "www.$SITE_HOST" >/dev/null; then
      [ "$(getent hosts "www.$SITE_HOST" | awk '{print $1}' | head -1)" = "$IP" ] && echo "www.$SITE_HOST: 이 서버 IP 로 연결됨" || echo "www.$SITE_HOST: 다른 IP 로 연결됨"
    else echo "www.$SITE_HOST: DNS 에 없음"; fi

jobs:
  run:
    name: phpMyAdmin (${{ inputs.step }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 실행 조건 확인
        env:
          STEP: ${{ inputs.step }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::main 브랜치에서만 실행합니다."; exit 1; }
          case "$STEP" in
            check|audit) ;;
            block) [ "$CONFIRM" = "BLOCK" ] || { echo "::error::block 은 confirm=BLOCK 이 필요합니다."; exit 1; } ;;
            *) echo "::error::알 수 없는 단계"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: AWS 자격증명 (보안그룹 임시 허용 모드)
        if: env.DEPLOY_ACCESS_MODE == 'aws-sg-temporary'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 보안그룹 임시 허용
        if: env.DEPLOY_ACCESS_MODE == 'aws-sg-temporary'
        env:
          AWS_SECURITY_GROUP_ID: ${{ vars.AWS_SECURITY_GROUP_ID }}
        run: bash scripts/deploy/aws-sg.sh open

      - name: SSH 설정
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: bash scripts/deploy/ssh-setup.sh

      - name: 서버 공인 IP 받기 (로그에서 가림)
        run: |
          set -euo pipefail
          IP="$(ssh thewoollim-prod "bash -s -- public-ip" < scripts/ops/phpmyadmin-remote.sh | tail -1 | tr -d '[:space:]')"
          [ -n "$IP" ] || { echo "::error::서버 공인 IP 를 알 수 없습니다."; exit 1; }
          echo "::add-mask::$IP"
          printf '%s' "$IP" > "$RUNNER_TEMP/server_ip"
          echo "공인 IP 를 받았습니다(값은 가림)."

      - name: 서버 밖에서 확인 (변경 전)
        run: bash -c "$PROBE"

      - name: 서버 설정 점검
        if: inputs.step == 'check'
        run: ssh thewoollim-prod "bash -s -- check" < scripts/ops/phpmyadmin-remote.sh

      - name: 과거 기록·기본 사이트 파일 점검
        if: inputs.step == 'audit'
        run: ssh thewoollim-prod "bash -s -- audit" < scripts/ops/phpmyadmin-remote.sh

      - name: 차단 적용
        if: inputs.step == 'block'
        run: ssh thewoollim-prod "bash -s -- block" < scripts/ops/phpmyadmin-remote.sh

      - name: 서버 밖에서 다시 확인 (변경 후)
        if: inputs.step == 'block'
        run: bash -c "$PROBE"

      - name: 보안그룹 임시 허용 제거
        if: always() && env.DEPLOY_ACCESS_MODE == 'aws-sg-temporary'
        env:
          AWS_SECURITY_GROUP_ID: ${{ vars.AWS_SECURITY_GROUP_ID }}
        run: bash scripts/deploy/aws-sg.sh close
