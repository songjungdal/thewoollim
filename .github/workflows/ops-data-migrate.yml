# [1회용] 운영 데이터 폴더(api/data)를 웹 루트 밖으로 옮기기 — docs/DEPLOYMENT.md 6-1
#
# 실행: GitHub 저장소 → Actions → "Ops - data dir migration (one-time)" → Run workflow (main 에서만)
#   step=check     읽기만 (웹서버·PHP 계정·권한·디스크·외부 접근·캐시·접근 로그 요약)
#   step=migrate   백업 → 복사 → 전환 → 확인 (confirm=MIGRATE)
#   step=finalize  옛 api/data 를 웹 루트 밖으로 이동 → 상태 코드 확인 (confirm=FINALIZE)
#
# 서버 접속은 배포 워크플로(deploy.yml)와 같은 방식·같은 production 환경 Secret 을 쓴다.
# 배포와 같은 concurrency 그룹이라 배포와 동시에 돌지 않는다.
# 작업이 끝나면 이 파일은 삭제한다(1회용).

name: Ops - data dir migration (one-time)

on:
  workflow_dispatch:
    inputs:
      step:
        description: "단계"
        type: choice
        options: [check, migrate, finalize]
        default: check
      confirm:
        description: "migrate 는 MIGRATE, finalize 는 FINALIZE 입력 (check 는 비워 둠)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: thewoollim-production
  cancel-in-progress: false

env:
  WEB_ROOT: ${{ vars.DEPLOY_WEB_ROOT || '/var/www/thewoollim' }}
  BACKUP_DIR: ${{ vars.DEPLOY_BACKUP_DIR || '/home/admin/deploy-backups' }}
  SITE_URL: ${{ vars.DEPLOY_SITE_URL || 'https://thewoollim.com' }}
  DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'admin' }}
  DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
  DEPLOY_ACCESS_MODE: ${{ vars.DEPLOY_ACCESS_MODE || 'direct' }}

jobs:
  run:
    name: 데이터 폴더 이전 (${{ inputs.step }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 실행 조건 확인
        env:
          STEP: ${{ inputs.step }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::main 브랜치에서만 실행합니다."; exit 1; }
          case "$STEP" in
            check) ;;
            migrate)  [ "$CONFIRM" = "MIGRATE" ]  || { echo "::error::migrate 는 confirm=MIGRATE 가 필요합니다."; exit 1; } ;;
            finalize) [ "$CONFIRM" = "FINALIZE" ] || { echo "::error::finalize 는 confirm=FINALIZE 가 필요합니다."; exit 1; } ;;
            *) echo "::error::알 수 없는 단계"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: AWS 자격증명 (보안그룹 임시 허용 모드)
        if: env.DEPLOY_ACCESS_MODE == 'aws-sg-temporary'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 보안그룹 임시 허용
        if: env.DEPLOY_ACCESS_MODE == 'aws-sg-temporary'
        env:
          AWS_SECURITY_GROUP_ID: ${{ vars.AWS_SECURITY_GROUP_ID }}
        run: bash scripts/deploy/aws-sg.sh open

      - name: SSH 설정
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: bash scripts/deploy/ssh-setup.sh

      - name: 서버에서 실행 (${{ inputs.step }})
        env:
          STEP: ${{ inputs.step }}
        run: |
          set -euo pipefail
          ssh thewoollim-prod "bash -s -- $(printf %q "$STEP") $(printf %q "$WEB_ROOT") $(printf %q "$SITE_URL") $(printf %q "$BACKUP_DIR")" \
            < scripts/ops/data-migrate-remote.sh

      - name: 보안그룹 임시 허용 제거
        if: always() && env.DEPLOY_ACCESS_MODE == 'aws-sg-temporary'
        env:
          AWS_SECURITY_GROUP_ID: ${{ vars.AWS_SECURITY_GROUP_ID }}
        run: bash scripts/deploy/aws-sg.sh close
